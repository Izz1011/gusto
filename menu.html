<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Menu | Gusto</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --white: #ffffff;
            --text-dark: #333333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
            color: var(--text-dark);
            line-height: 1.6;
        }

        header {
            background: var(--primary-gradient);
            color: var(--white);
            padding: 2rem;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .menu-category {
            background: var(--white);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }

        h2 { color: #764ba2; margin-bottom: 1rem; border-bottom: 2px solid #f0f0f0; padding-bottom: 0.5rem; }

        .menu-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .price { font-weight: 600; color: #667eea; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 2rem;
            color: #764ba2;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header>
        <h1>Daftar Menu Gusto</h1>
    </header>

    <div class="container">
        <section class="menu-category">
            <h2>Makanan Utama</h2>
            <div class="menu-item"><span>Nasi Goreng Gusto</span> <span class="price">Rp 28.000</span></div>
            <div class="menu-item"><span>Ayam Bakar Kecap</span> <span class="price">Rp 32.000</span></div>
            <div class="menu-item"><span>Mie Godog Jawa</span> <span class="price">Rp 25.000</span></div>
        </section>

        <section class="menu-category">
            <h2>Minuman</h2>
            <div class="menu-item"><span>Es Teh Manis</span> <span class="price">Rp 6.000</span></div>
            <div class="menu-item"><span>Es Jeruk Peras</span> <span class="price">Rp 10.000</span></div>
            <div class="menu-item"><span>Kopi Susu Gusto</span> <span class="price">Rp 15.000</span></div>
        </section>

        <section class="menu-category">
            <h2>Penutup</h2>
            <div class="menu-item"><span>Pisang Goreng Coklat Keju</span> <span class="price">Rp 14.000</span></div>
            <div class="menu-item"><span>Es Campur Gusto</span> <span class="price">Rp 16.000</span></div>
        </section>

        <a href="index.html" class="back-link">&larr; Kembali ke Beranda</a>
    </div>
</body>
</html>
